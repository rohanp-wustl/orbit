<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit — interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --spaceDeep:#14152E;
    --panelNavy:#20244F;
    --cardWhite:#FFFFFF;
    --navSurfaceDark:#FFFFFF;
    --navSurfaceLight:#F5F6FB;
    --navIconInactive:#D6D9F0;
    --accentBlue:#3D5AFE;
    --textOnDark:#FFFFFF;
    --textOnDarkMuted:#A9ADD6;
    --textOnLight:#1A1B3D;
    --textOnLightMuted:#6E7191;
    --dividerLight:#EDEEF7;
    --hullCap:#343B57;
    --hullCapLight:#4A5170;
    --magenta:#E0399B;
    --violet:#8452D6;
    --seafoam:#3FD9B0;
    --gold:#F2A93B;
    --ember:#E8432E;
    --lime:#C6E23C;
    --cloudGray:#C9C3D9;
    --sky:#7CC4FF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#DEDFE6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display-font{ font-family:'Baloo 2', sans-serif; }

  /* ---------- phone frame ---------- */
  .phone-wrap{ padding:40px 20px; }
  .phone{
    position:relative;
    width:390px;
    height:844px;
    border-radius:52px;
    overflow:hidden;
    background:#000;
    box-shadow:0 40px 90px rgba(20,21,46,.45), 0 0 0 10px #0B0C1E;
  }
  .starfield{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  .star{ position:absolute; width:4px; height:4px; background:#fff; transform:rotate(45deg); border-radius:1px; }

  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    z-index:1;
    overflow:hidden;
  }
  .screen.active{ display:flex; }

  /* ---------- shared bits ---------- */
  .pill-btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--accentBlue); color:#fff;
    font-family:'Poppins',sans-serif; font-weight:600; font-size:16px;
    border:none; border-radius:999px; padding:16px 28px;
    cursor:pointer; user-select:none;
    transition:transform .12s ease, filter .12s ease;
  }
  .pill-btn:active{ transform:scale(.96); filter:brightness(.92); }

  .navbar{
    position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    z-index:5;
    display:flex; gap:6px;
    background:var(--navSurfaceDark);
    border-radius:30px;
    padding:10px 10px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .navbar.light{ background:var(--navSurfaceLight); }
  .navbar.hidden{ display:none; }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width:66px; padding:6px 0 4px;
    border:none; background:none; cursor:pointer;
    color:var(--navIconInactive);
    font-family:'Poppins',sans-serif; font-size:11px; font-weight:500;
  }
  .nav-item svg{ width:22px; height:22px; }
  .nav-item.active{ color:var(--accentBlue); }

  /* ---------- Login ---------- */
  #screen-login{ background:var(--spaceDeep); align-items:center; justify-content:center; padding:0 32px; text-align:center; }
  .login-planet{ position:absolute; bottom:-40px; right:-40px; opacity:.95; }
  .login-title{ color:var(--textOnDark); font-size:44px; font-weight:800; margin:18px 0 6px; }
  .login-sub{ color:var(--textOnDarkMuted); font-size:14px; font-weight:400; max-width:260px; line-height:1.5; margin-bottom:28px; }
  .login-cosmo{ margin-bottom:4px; }

  /* ---------- Home ---------- */
  #screen-home{ background:var(--spaceDeep); padding:28px 24px 0; }
  .home-greeting{ color:var(--textOnDarkMuted); font-size:13px; font-weight:500; z-index:2; }
  .home-scene{ position:relative; flex:1; margin-top:6px; }
  .cta-wrap{ position:absolute; bottom:104px; left:0; right:0; display:flex; justify-content:center; z-index:4; }
  .waiting-pkg{ position:absolute; cursor:pointer; text-align:center; }
  .waiting-pkg-label{ color:var(--textOnDarkMuted); font-size:10px; margin-top:2px; font-weight:500; }
  .empty-home{ position:absolute; left:0; right:0; top:38%; text-align:center; color:var(--textOnDarkMuted); font-size:13px; }

  /* ---------- Create ---------- */
  #screen-create{ background:var(--panelNavy); padding:26px 22px 0; }
  .create-title{ color:var(--textOnDark); font-size:20px; font-weight:700; margin-bottom:16px; font-family:'Baloo 2',sans-serif; }
  .recipient-row{ display:flex; align-items:center; gap:12px; background:var(--spaceDeep); border-radius:20px; padding:12px 16px; margin-bottom:20px; }
  .recipient-avatar{ width:38px; height:38px; border-radius:50%; flex-shrink:0; }
  .recipient-name{ color:var(--textOnDark); font-size:15px; font-weight:500; }
  .swatch-label, .attach-label{ color:var(--textOnDarkMuted); font-size:12px; font-weight:600; margin:4px 0 10px; text-transform:none; }
  .swatch-row{ display:flex; gap:10px; margin-bottom:22px; }
  .swatch{ width:38px; height:38px; border-radius:12px; border:3px solid transparent; cursor:pointer; }
  .swatch.selected{ border-color:#fff; }
  .attach-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .attach-tile{ background:var(--spaceDeep); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; cursor:pointer; border:2px solid transparent; }
  .attach-tile.added{ border-color:var(--accentBlue); }
  .attach-tile svg{ width:22px; height:22px; }
  .attach-tile span{ color:var(--textOnDark); font-size:13px; font-weight:500; }
  .create-preview{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .create-preview-label{ color:var(--textOnDarkMuted); font-size:12px; }
  .launch-wrap{ position:absolute; bottom:104px; left:22px; right:22px; }
  .launch-wrap .pill-btn{ width:100%; }

  /* ---------- Galaxy ---------- */
  #screen-galaxy{ background:var(--spaceDeep); }
  .galaxy-scene{ position:relative; flex:1; }
  .orbit-ring{ position:absolute; border:1px dashed rgba(169,173,214,.35); border-radius:50%; top:50%; left:50%; }
  .planet-node{ position:absolute; cursor:pointer; text-align:center; }
  .planet-tooltip{
    position:absolute; background:#fff; color:var(--textOnLight); font-size:12px; font-weight:500;
    padding:8px 12px; border-radius:12px; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:6;
  }
  .planet-tooltip.show{ opacity:1; }
  .transit-ship{ position:absolute; }

  /* ---------- Settings ---------- */
  #screen-settings{ background:var(--cardWhite); padding:30px 22px 0; }
  .settings-title{ color:var(--textOnLight); font-size:22px; font-weight:700; margin-bottom:18px; font-family:'Baloo 2',sans-serif; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 2px; border-bottom:1px solid var(--dividerLight); cursor:pointer; }
  .settings-row span{ color:var(--textOnLight); font-size:15px; font-weight:500; }
  .settings-row svg{ width:16px; height:16px; color:var(--textOnLightMuted); }

  /* ---------- Package opening takeover ---------- */
  #opening-overlay{
    position:absolute; inset:0; z-index:20;
    display:none; align-items:center; justify-content:center;
    background:rgba(10,10,26,0);
    transition:background .25s ease;
  }
  #opening-overlay.show{ display:flex; }
  #opening-overlay.dim{ background:rgba(10,10,26,.72); }
  .opening-pkg{ transition:transform .25s ease, opacity .3s ease; }
  .opening-pkg.focused{ transform:scale(1.5); }
  @keyframes shakeWiggle{
    0%,100%{ transform:scale(1.5) rotate(0deg); }
    20%{ transform:scale(1.5) rotate(-8deg); }
    40%{ transform:scale(1.5) rotate(7deg); }
    60%{ transform:scale(1.5) rotate(-6deg); }
    80%{ transform:scale(1.5) rotate(5deg); }
  }
  .opening-pkg.shaking{ animation:shakeWiggle .55s ease-in-out 2; }
  .opening-pkg.burst-lid{ opacity:0; }
  .confetti-layer{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.7); transition:opacity .3s ease, transform .3s ease; pointer-events:none; }
  .confetti-layer.show{ opacity:1; transform:scale(1); }
  /* The capsule's INSIDE is a different register from the app's matte-navy
     chrome on purpose — a warm handmade scrapbook page, not another space
     screen. Colors here are a best-guess kraft palette pending the real
     Redraft-generated asset; see docs/STYLE_SHEET.md. */
  #reveal-sheet{
    position:absolute; left:0; right:0; bottom:0; height:0;
    background:#F4E8D0; border-radius:28px 28px 0 0;
    transition:height .38s cubic-bezier(.2,.8,.2,1);
    overflow:hidden; padding:0 26px;
  }
  #reveal-sheet.show{ height:90%; padding:26px; }
  .reveal-close{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; background:rgba(60,40,20,.12); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#5B4632; }
  .reveal-sender{ color:#5B4632; font-size:20px; font-weight:700; font-family:'Baloo 2',sans-serif; margin:34px 0 6px; }
  .scrapbook-photos{ position:relative; height:190px; margin-bottom:14px; }
  .scrapbook-photo{ position:absolute; background:#FFFDF8; padding:8px 8px 26px; border-radius:3px; box-shadow:0 10px 20px rgba(60,40,20,.28); }
  .washi-tape{ position:absolute; opacity:.85; border-radius:2px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
  #landed-text{
    position:absolute; top:58%; left:50%; transform:translate(-50%,-50%);
    color:var(--seafoam-text, #3FD9B0); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:20px;
    opacity:0; transition:opacity .3s ease; pointer-events:none;
  }
  #landed-text.show{ opacity:1; }
  .reveal-message{ font-family:'Caveat',cursive; font-size:27px; color:#5B4632; line-height:1.25; }
  .reveal-cosmo{ position:absolute; right:20px; bottom:20px; }

  /* ---------- toast ---------- */
  #toast{
    position:absolute; top:26px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:#fff; color:var(--textOnLight); font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:999px; box-shadow:0 10px 24px rgba(0,0,0,.25);
    opacity:0; transition:opacity .25s ease, transform .25s ease; z-index:30; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- packing overlay ---------- */
  #packing-overlay{
    position:absolute; inset:0; z-index:25; background:var(--panelNavy);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  #packing-overlay.show{ display:flex; }
  #packing-overlay p{ color:var(--textOnDarkMuted); font-size:14px; font-weight:500; }

  /* ---------- first-run tutorial ---------- */
  #tutorial-overlay{
    position:absolute; inset:0; z-index:22; background:var(--spaceDeep);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:0 40px; text-align:center;
  }
  #tutorial-overlay.show{ display:flex; }
  .tutorial-bubble{
    background:#fff; color:var(--textOnLight); font-size:15px; font-weight:600;
    padding:14px 22px; border-radius:18px; position:relative; font-family:'Poppins',sans-serif;
  }
  .tutorial-bubble:after{
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:9px solid #fff;
  }
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone" id="phone">
    <div class="starfield" id="starfield"></div>

    <!-- LOGIN -->
    <div class="screen active" id="screen-login">
      <div class="login-planet" id="login-planet"></div>
      <div class="login-cosmo" id="login-cosmo"></div>
      <div class="login-title display-font">Orbit</div>
      <div class="login-sub">Send a piece of your world</div>
      <button class="pill-btn" onclick="signIn()">Sign in with Apple</button>
    </div>

    <!-- HOME -->
    <div class="screen" id="screen-home">
      <div class="home-greeting">Your launchpad</div>
      <div class="home-scene" id="home-scene"></div>
    </div>

    <!-- CREATE -->
    <div class="screen" id="screen-create">
      <div class="create-title">Create a capsule</div>
      <div class="recipient-row">
        <div class="recipient-avatar" id="recipient-avatar"></div>
        <div class="recipient-name">To: Maya</div>
      </div>
      <div class="create-preview">
        <div id="create-preview-icon"></div>
        <div class="create-preview-label">Your capsule's color</div>
      </div>
      <div class="swatch-label">Package color</div>
      <div class="swatch-row" id="swatch-row"></div>
      <div class="attach-label">Add to this capsule</div>
      <div class="attach-grid" id="attach-grid"></div>
      <div class="launch-wrap">
        <button class="pill-btn" onclick="launchCapsule()">Launch</button>
      </div>
    </div>

    <!-- GALAXY -->
    <div class="screen" id="screen-galaxy">
      <div class="galaxy-scene" id="galaxy-scene"></div>
    </div>

    <!-- SETTINGS -->
    <div class="screen" id="screen-settings">
      <div class="settings-title">Settings</div>
      <div id="settings-list"></div>
    </div>

    <!-- PACKING OVERLAY -->
    <div id="packing-overlay">
      <div id="packing-cosmo"></div>
      <p>Packing your capsule…</p>
    </div>

    <!-- FIRST-RUN TUTORIAL -->
    <div id="tutorial-overlay">
      <div id="tutorial-cosmo"></div>
      <div class="tutorial-bubble">Let's send your first package!</div>
      <button class="pill-btn" onclick="dismissTutorial()">Got it</button>
    </div>

    <!-- PACKAGE OPENING TAKEOVER -->
    <div id="opening-overlay">
      <div class="opening-pkg" id="opening-pkg-el"></div>
      <div class="confetti-layer" id="confetti-layer"></div>
      <div id="landed-text">Capsule landed!</div>
      <div id="reveal-sheet">
        <button class="reveal-close" onclick="closeOpening()">✕</button>
        <div class="reveal-sender" id="reveal-sender"></div>
        <div class="scrapbook-photos" id="scrapbook-photos"></div>
        <div class="reveal-message" id="reveal-message"></div>
        <div class="reveal-cosmo" id="reveal-cosmo"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- NAV -->
    <div class="navbar hidden" id="navbar"></div>
  </div>
</div>

<script>
/* =========================================================
   Real uploaded assets, inlined directly (drawable content
   only — the C2PA metadata block each file shipped with has
   been stripped so this file isn't needlessly bloated).

/* =========================================================
   Color helpers — used to derive the light-tint / dark-shade
   half of each two-tone flat split from a single recolor hue,
   per the style sheet's "one flat hue, tinted/shaded as flat
   shapes, never a gradient" rule.
   ========================================================= */
function hexToRgb(hex){
  const h = hex.replace('#','');
  const n = parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function lighten(hex, amt){
  const [r,g,b]=hexToRgb(hex);
  return rgbToHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt);
}
function darken(hex, amt){
  const [r,g,b]=hexToRgb(hex);
  return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt));
}

let uidCounter = 0;
function uid(prefix){ return prefix+'-'+(uidCounter++); }

const HUES = {
  magenta:'#E0399B', violet:'#8452D6', seafoam:'#3FD9B0',
  gold:'#F2A93B', ember:'#E8432E', lime:'#C6E23C'
};
const HUE_LIST = Object.values(HUES);

/* =========================================================
   SVG component builders — hand-built flat vector shapes
   that follow the written construction spec exactly, so any
   recolor hue can be dropped in and stay pixel-exact to the
   locked palette. (Why not the raw uploaded ship/planet/
   package files: see the note at the end of this file.)
   ========================================================= */
function shipSVG(hue, opts={}){
  const {flame=false, width=110} = opts;
  const id = uid('ship');
  const light = lighten(hue, 0.35);
  const skyLight = lighten('#7CC4FF', 0.45);
  return `<svg viewBox="0 0 200 300" width="${width}" height="${width*1.5}" aria-hidden="true">
    <defs><clipPath id="clip-${id}"><rect x="60" y="0" width="40" height="300"/></clipPath></defs>
    ${flame ? `
      <path d="M78,190 Q100,266 122,190 Q100,236 78,190 Z" fill="${HUES.ember}"/>
      <path d="M87,190 Q100,244 113,190 Q100,220 87,190 Z" fill="${HUES.gold}"/>
    ` : ''}
    <polygon points="60,158 16,216 54,204" fill="#C9C3D9"/>
    <polygon points="140,158 184,216 146,204" fill="#C9C3D9"/>
    <rect x="58" y="168" width="84" height="20" rx="6" fill="#343B57"/>
    <rect x="60" y="46" width="80" height="132" rx="30" fill="${hue}"/>
    <rect x="60" y="46" width="80" height="132" rx="30" fill="${light}" clip-path="url(#clip-${id})"/>
    <path d="M92,4 A9,9 0 0 1 108,4 L138,48 L62,48 Z" fill="#343B57"/>
    <path d="M92,4 A9,9 0 0 1 108,4 L138,48 L62,48 Z" fill="#4A5170" clip-path="url(#clip-${id})"/>
    <circle cx="100" cy="92" r="17" fill="#343B57"/>
    <circle cx="100" cy="92" r="13" fill="#7CC4FF"/>
    <path d="M100,92 L100,79 A13,13 0 0 0 87,92 Z" fill="${skyLight}"/>
  </svg>`;
}

function planetSVG(hue, opts={}){
  const {size=100, rings=false} = opts;
  const id = uid('planet');
  const dark = darken(hue, 0.22);
  const ringLight = lighten(hue, 0.55);
  const R = 50;
  return `<svg viewBox="-70 -70 140 140" width="${size}" height="${size}" aria-hidden="true">
    <defs><clipPath id="clip-${id}"><circle cx="0" cy="0" r="${R}"/></clipPath></defs>
    ${rings ? `<ellipse cx="0" cy="2" rx="${R*1.55}" ry="${R*0.26}" fill="none" stroke="${ringLight}" stroke-width="3" opacity=".45"/>` : ''}
    <circle cx="0" cy="0" r="${R}" fill="${hue}"/>
    <circle cx="${R*0.8}" cy="${-R*0.05}" r="${R}" fill="${dark}" clip-path="url(#clip-${id})" opacity=".85"/>
    <circle cx="${-R*0.28}" cy="${R*0.3}" r="${R*0.12}" fill="${dark}" clip-path="url(#clip-${id})"/>
    <circle cx="${R*0.05}" cy="${-R*0.38}" r="${R*0.08}" fill="${dark}" clip-path="url(#clip-${id})"/>
    ${rings ? `<path d="M ${-R*1.55} 2 A ${R*1.55} ${R*0.26} 0 0 0 ${R*1.55} 2" fill="none" stroke="${ringLight}" stroke-width="3" opacity=".9"/>` : ''}
  </svg>`;
}

function packageSVG(hue, opts={}){
  const {size=64} = opts;
  const seam = lighten(hue, 0.45);
  return `<svg viewBox="0 0 90 138" width="${size}" height="${size*138/90}" aria-hidden="true">
    <ellipse cx="45" cy="129" rx="25" ry="6" fill="#000000" opacity=".18"/>
    <rect x="20" y="6" width="50" height="118" rx="25" fill="${hue}"/>
    <rect x="20" y="59" width="50" height="7" fill="${seam}"/>
    <circle cx="33" cy="28" r="6" fill="#FFFFFF" opacity=".4"/>
  </svg>`;
}

function cosmoSVG(pose, hue='#E0399B', opts={}){
  const {size=110} = opts;
  const skyLight = lighten('#7CC4FF', 0.45);
  let arms='', eyes='', extra='';
  if (pose==='pack'){
    arms = `<path d="M28,150 Q6,168 20,190" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>
             <path d="M102,150 Q124,168 110,190" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>`;
    eyes = `<circle cx="52" cy="72" r="4" fill="#1A1B3D"/><circle cx="78" cy="72" r="4" fill="#1A1B3D"/>`;
  } else if (pose==='sleep'){
    arms = `<path d="M30,150 Q24,168 40,178" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>
             <path d="M100,150 Q106,168 90,178" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>`;
    eyes = `<path d="M46,72 q6,6 12,0" stroke="#1A1B3D" stroke-width="3" fill="none" stroke-linecap="round"/>
             <path d="M72,72 q6,6 12,0" stroke="#1A1B3D" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    extra = `<text x="112" y="36" font-size="18" fill="#A9ADD6" font-family="Poppins, sans-serif">z</text>
             <text x="126" y="20" font-size="13" fill="#A9ADD6" font-family="Poppins, sans-serif">z</text>`;
  } else if (pose==='cheer'){
    arms = `<path d="M30,150 Q4,108 22,78" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>
             <path d="M100,150 Q126,108 108,78" stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"/>`;
    eyes = `<path d="M46,74 q6,-6 12,0" stroke="#1A1B3D" stroke-width="3" fill="none" stroke-linecap="round"/>
             <path d="M72,74 q6,-6 12,0" stroke="#1A1B3D" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 130 230" width="${size}" height="${size*1.77}" aria-hidden="true">
    ${arms}
    <rect x="42" y="196" width="18" height="22" rx="8" fill="${hue}"/>
    <rect x="70" y="196" width="18" height="22" rx="8" fill="${hue}"/>
    <rect x="18" y="128" width="18" height="50" rx="9" fill="${hue}"/>
    <rect x="25" y="110" width="80" height="96" rx="34" fill="#FFFFFF"/>
    <circle cx="65" cy="66" r="62" fill="#FFFFFF"/>
    <circle cx="34" cy="80" r="7" fill="#F2A93B" opacity=".45"/>
    <circle cx="65" cy="66" r="30" fill="#7CC4FF"/>
    <path d="M65,66 L65,36 A30,30 0 0 0 35,66 Z" fill="${skyLight}"/>
    ${eyes}
    ${extra}
  </svg>`;
}

function waveCosmoSVG(size=120){
  return `<svg viewBox="0 0 1024 1024" width="${size}" height="${size}" aria-hidden="true">${WAVE_INNER}</svg>`;
}
function confettiSVG(large, size=220){
  return `<svg viewBox="0 0 1024 1024" width="${size}" height="${size}" aria-hidden="true">${large ? CONFETTI_LARGE_INNER : CONFETTI_SMALL_INNER}</svg>`;
}

/* small flat nav / UI glyphs, single-color via currentColor */
const ICONS = {
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>`,
  create: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,
  galaxy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><ellipse cx="12" cy="12" rx="10" ry="3.6"/></svg>`,
  settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="9" cy="7" r="2.1" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2.1" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="11" cy="17" r="2.1" fill="currentColor" stroke="none"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`,
  photo: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6" fill="#fff" stroke="none"/><path d="M3 16l5-4 4 3 4-5 5 6"/></svg>`,
  voice: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/></svg>`,
  video: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>`,
  note: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>`,
};

/* =========================================================
   App state
   ========================================================= */
const state = {
  screen: 'login',
  myHue: HUES.seafoam,
  tutorialSeen: false,
  attached: {photo:false, voice:false, video:false, note:false},
  waitingPackages: [
    {id:'p1', hue: HUES.magenta, sender:'Maya', message:"the lake trip, right before it rained", opened:false},
    {id:'p2', hue: HUES.gold, sender:'Grandpa Joe', message:"Caught a fish bigger than your cousin's ego. Wish you were here to see it before it got away.", opened:false},
  ],
  galaxyPlanets: [
    {name:'Mia', hue: HUES.gold, x:0.72, y:0.32, note:'2 days away'},
    {name:'Grandpa Joe', hue: HUES.lime, x:0.22, y:0.62, note:'landed 4h ago'},
    {name:'Devon', hue: HUES.magenta, x:0.68, y:0.78, note:'6 hours away'},
  ]
};

/* =========================================================
   Render: Login
   ========================================================= */
function renderLogin(){
  document.getElementById('login-planet').innerHTML = planetSVG(HUES.magenta, {size:180});
  document.getElementById('login-cosmo').innerHTML = waveCosmoSVG(130);
}

/* =========================================================
   Render: Home
   ========================================================= */
function renderHome(){
  const scene = document.getElementById('home-scene');
  const openCount = state.waitingPackages.filter(p=>!p.opened).length;

  let html = `
    <svg viewBox="0 0 342 560" width="100%" height="100%" style="position:absolute; inset:0;" aria-hidden="true">
      <rect x="30" y="60" width="14" height="270" rx="7" fill="var(--panelNavy)"/>
      <rect x="10" y="140" width="54" height="10" rx="5" fill="var(--panelNavy)"/>
      <rect x="14" y="220" width="46" height="10" rx="5" fill="var(--panelNavy)"/>
      <ellipse cx="171" cy="360" rx="150" ry="26" fill="var(--panelNavy)"/>
      <ellipse cx="171" cy="360" rx="90" ry="16" fill="none" stroke="var(--accentBlue)" stroke-width="3" opacity=".8"/>
    </svg>
    <div style="position:absolute; left:50%; top:190px; transform:translateX(-50%);">
      ${shipSVG(state.myHue, {width:104})}
    </div>
  `;

  if (openCount === 0){
    html += `<div class="empty-home">
      <div style="display:flex; justify-content:center;">${cosmoSVG('sleep', state.myHue, {size:100})}</div>
      <div style="margin-top:6px;">No capsules waiting right now.</div>
    </div>`;
  } else {
    const positions = [{left:'8%', top:'56%'}, {left:'70%', top:'50%'}];
    state.waitingPackages.forEach((pkg, i) => {
      if (pkg.opened) return;
      const pos = positions[i % positions.length];
      html += `<div class="waiting-pkg" style="left:${pos.left}; top:${pos.top};" onclick="openPackage('${pkg.id}')">
        ${packageSVG(pkg.hue, {size:58})}
        <div class="waiting-pkg-label">From ${pkg.sender}</div>
      </div>`;
    });
  }

  html += `<div class="cta-wrap"><button class="pill-btn" onclick="goScreen('create')">Send a package</button></div>`;
  scene.innerHTML = html;
}

/* =========================================================
   Render: Create
   ========================================================= */
function renderCreate(){
  document.getElementById('recipient-avatar').innerHTML = planetSVG(HUES.magenta, {size:38});
  document.getElementById('create-preview-icon').innerHTML = packageSVG(state.myHue, {size:36});

  const row = document.getElementById('swatch-row');
  row.innerHTML = HUE_LIST.map(h => `
    <div class="swatch ${h===state.myHue?'selected':''}" style="background:${h}" onclick="pickHue('${h}')"></div>
  `).join('');

  const grid = document.getElementById('attach-grid');
  const tiles = [['photo','Photo'],['voice','Voice'],['video','Video'],['note','Note']];
  grid.innerHTML = tiles.map(([key,label]) => `
    <div class="attach-tile ${state.attached[key]?'added':''}" onclick="toggleAttach('${key}')">
      ${ICONS[key]}
      <span>${label}</span>
    </div>
  `).join('');
}
function pickHue(h){ state.myHue = h; renderCreate(); renderHome(); }
function toggleAttach(key){ state.attached[key] = !state.attached[key]; renderCreate(); }

function launchCapsule(){
  const overlay = document.getElementById('packing-overlay');
  document.getElementById('packing-cosmo').innerHTML = cosmoSVG('pack', state.myHue, {size:120});
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.remove('show');
    state.attached = {photo:false, voice:false, video:false, note:false};
    goScreen('home');
    showToast('🚀 Capsule launched — on its way to Maya');
  }, 1400);
}

/* =========================================================
   Render: Galaxy
   ========================================================= */
function renderGalaxy(){
  const scene = document.getElementById('galaxy-scene');
  let html = `
    <div class="orbit-ring" style="width:200px; height:200px; margin:-100px 0 0 -100px;"></div>
    <div class="orbit-ring" style="width:320px; height:320px; margin:-160px 0 0 -160px;"></div>
    <div style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
      ${planetSVG(HUES.violet === state.myHue ? state.myHue : HUES.violet, {size:70, rings:true})}
    </div>
  `;
  state.galaxyPlanets.forEach((p, i) => {
    html += `<div class="planet-node" style="left:${p.x*100}%; top:${p.y*100}%; transform:translate(-50%,-50%);" onclick="toggleTooltip(${i})">
      ${planetSVG(p.hue, {size:52})}
      <div class="planet-tooltip" id="tip-${i}">${p.name} · ${p.note}</div>
    </div>`;
  });
  html += `<div class="transit-ship" id="transit-ship" style="left:38%; top:60%;">${shipSVG(HUES.seafoam, {width:34, flame:true})}</div>`;
  scene.innerHTML = html;
}
function toggleTooltip(i){
  document.querySelectorAll('.planet-tooltip').forEach(t => t.classList.remove('show'));
  const tip = document.getElementById('tip-'+i);
  tip.classList.add('show');
  setTimeout(()=>tip.classList.remove('show'), 2200);
}

/* =========================================================
   Render: Settings
   ========================================================= */
function renderSettings(){
  const rows = ['Account','Notifications','Sound & haptics','About Orbit'];
  document.getElementById('settings-list').innerHTML = rows.map(r => `
    <div class="settings-row"><span>${r}</span>${ICONS.chevron}</div>
  `).join('');
}

/* Two overlapping "polaroid" blocks + one washi-tape strip, standing in for
   real uploaded photos — matches the scrapbook-page reference. */
function buildScrapbookPhotos(hue){
  const light = lighten(hue, 0.35);
  return `
    <div class="scrapbook-photo" style="left:4px; top:8px; width:118px; height:140px; transform:rotate(-7deg);">
      <div style="width:100%; height:100%; background:${hue}; border-radius:2px;"></div>
    </div>
    <div class="scrapbook-photo" style="left:118px; top:26px; width:102px; height:120px; transform:rotate(6deg);">
      <div style="width:100%; height:100%; background:${light}; border-radius:2px;"></div>
    </div>
    <div class="washi-tape" style="left:-4px; top:-4px; width:52px; height:20px; background:${HUES.seafoam}; transform:rotate(-18deg);"></div>
  `;
}

/* =========================================================
   Package opening takeover
   ========================================================= */
let currentOpeningId = null;
function openPackage(id){
  const pkg = state.waitingPackages.find(p => p.id===id);
  if (!pkg) return;
  currentOpeningId = id;

  const overlay = document.getElementById('opening-overlay');
  const pkgEl = document.getElementById('opening-pkg-el');
  const confettiLayer = document.getElementById('confetti-layer');
  const sheet = document.getElementById('reveal-sheet');

  pkgEl.className = 'opening-pkg';
  pkgEl.innerHTML = packageSVG(pkg.hue, {size:120});
  confettiLayer.className = 'confetti-layer';
  confettiLayer.innerHTML = confettiSVG(true, 260);
  sheet.className = '';
  document.getElementById('reveal-sender').textContent = '';
  document.getElementById('reveal-message').textContent = '';
  document.getElementById('scrapbook-photos').innerHTML = '';
  document.getElementById('reveal-cosmo').innerHTML = '';
  document.getElementById('landed-text').classList.remove('show');

  overlay.className = 'show';
  document.getElementById('navbar').classList.add('hidden');

  // focus
  requestAnimationFrame(() => { overlay.classList.add('dim'); pkgEl.classList.add('focused'); });
  // shake
  setTimeout(() => pkgEl.classList.add('shaking'), 500);
  // burst
  setTimeout(() => {
    pkgEl.classList.add('burst-lid');
    confettiLayer.classList.add('show');
    document.getElementById('landed-text').classList.add('show');
  }, 1350);
  // reveal
  setTimeout(() => {
    document.getElementById('landed-text').classList.remove('show');
    document.getElementById('reveal-sender').textContent = `From ${pkg.sender}`;
    document.getElementById('scrapbook-photos').innerHTML = buildScrapbookPhotos(pkg.hue);
    document.getElementById('reveal-message').textContent = pkg.message;
    document.getElementById('reveal-cosmo').innerHTML = cosmoSVG('cheer', pkg.hue, {size:80});
    sheet.classList.add('show');
  }, 2000);
}
function closeOpening(){
  const pkg = state.waitingPackages.find(p => p.id===currentOpeningId);
  if (pkg) pkg.opened = true;
  document.getElementById('opening-overlay').className = '';
  document.getElementById('reveal-sheet').className = '';
  updateNavVisibility();
  renderHome();
}

/* =========================================================
   Toast
   ========================================================= */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

/* =========================================================
   Navigation
   ========================================================= */
const NAV_TABS = [
  {key:'home', label:'Home', icon:'home'},
  {key:'create', label:'Create', icon:'create'},
  {key:'galaxy', label:'Galaxy', icon:'galaxy'},
  {key:'settings', label:'Settings', icon:'settings'},
];
function renderNav(){
  const nav = document.getElementById('navbar');
  nav.classList.toggle('light', state.screen==='settings');
  nav.innerHTML = NAV_TABS.map(t => `
    <button class="nav-item ${state.screen===t.key?'active':''}" onclick="goScreen('${t.key}')">
      ${ICONS[t.icon]}<span>${t.label}</span>
    </button>
  `).join('');
}
function updateNavVisibility(){
  const nav = document.getElementById('navbar');
  const showNav = ['home','create','galaxy','settings'].includes(state.screen);
  nav.classList.toggle('hidden', !showNav);
}
function updateStarfieldVisibility(){
  const sf = document.getElementById('starfield');
  sf.style.display = ['login','home','galaxy'].includes(state.screen) ? 'block' : 'none';
}

function goScreen(name){
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  renderNav();
  updateNavVisibility();
  updateStarfieldVisibility();
  if (name==='home') renderHome();
  if (name==='create') renderCreate();
  if (name==='galaxy') renderGalaxy();
  if (name==='settings') renderSettings();
}
function signIn(){
  goScreen('home');
  if (!state.tutorialSeen) showTutorial();
}
function showTutorial(){
  document.getElementById('tutorial-cosmo').innerHTML = waveCosmoSVG(140);
  document.getElementById('tutorial-overlay').classList.add('show');
}
function dismissTutorial(){
  state.tutorialSeen = true;
  document.getElementById('tutorial-overlay').classList.remove('show');
}

/* =========================================================
   Starfield generation (Login / Home / Galaxy only)
   ========================================================= */
function buildStarfield(){
  const sf = document.getElementById('starfield');
  let html = '';
  for (let i=0;i<40;i++){
    const left = Math.random()*100;
    const top = Math.random()*100;
    const s = 2 + Math.random()*3;
    const op = 0.25 + Math.random()*0.55;
    html += `<div class="star" style="left:${left}%; top:${top}%; width:${s}px; height:${s}px; opacity:${op};"></div>`;
  }
  sf.innerHTML = html;
}

/* =========================================================
   Init
   ========================================================= */
buildStarfield();
renderLogin();
renderNav();
updateNavVisibility();
updateStarfieldVisibility();
</script>
